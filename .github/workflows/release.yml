name: release

# Push a tag like v0.2.0 to build, test and publish a GitHub Release with the MSI.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The IIS Manager snap-in compiles against Microsoft.Web.Management.dll,
      # which only exists when the IIS Management Console is installed.
      - name: Install IIS Management Console
        shell: powershell
        run: Install-WindowsFeature Web-Server, Web-CGI, Web-Mgmt-Console | Out-Null

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = ([xml](Get-Content src/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $module = (Import-PowerShellDataFile src/Phiis.PowerShell/Phiis.psd1).ModuleVersion
          if ($tag -ne $version -or $tag -ne $module) {
            throw "Tag v$tag does not match Directory.Build.props ($version) / Phiis.psd1 ($module)."
          }

      - name: Build
        run: dotnet build src/Phiis.slnx -c Release

      - name: Test
        run: dotnet test src/Phiis.Tests/Phiis.Tests.csproj -c Release --no-build

      - name: Checksum
        shell: powershell
        run: |
          Get-ChildItem src/Phiis.Setup/bin/x64/Release/*.msi | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii src/Phiis.Setup/bin/x64/Release/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src/Phiis.Setup/bin/x64/Release/*.msi
            src/Phiis.Setup/bin/x64/Release/SHA256SUMS.txt
