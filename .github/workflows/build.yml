name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The IIS Manager snap-in compiles against Microsoft.Web.Management.dll,
      # which only exists when the IIS Management Console is installed.
      - name: Install IIS Management Console
        shell: powershell
        run: Install-WindowsFeature Web-Server, Web-CGI, Web-Mgmt-Console | Out-Null

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/Phiis.slnx -c Release

      - name: Test
        run: dotnet test src/Phiis.Tests/Phiis.Tests.csproj -c Release --no-build

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Phiis-msi
          path: src/Phiis.Setup/bin/x64/Release/*.msi
